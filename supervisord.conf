[supervisord]
nodaemon=true
user=frappe

[program:redis]
command=redis-server
autostart=true
autorestart=true
priority=1

[program:mariadb]
command=mysqld_safe
autostart=true
autorestart=true
priority=2

[program:init-site]
command=/bin/bash -c "cd /home/frappe/frappe-bench && bench new-site airplane.local --admin-password admin --db-root-password root && bench --site airplane.local install-app airplane_mode && bench set-config redis_cache redis://localhost:6379 --site airplane.local && bench set-config redis_queue redis://localhost:6379 --site airplane.local && bench set-config redis_socketio redis://localhost:6379 --site airplane.local"
autostart=true
autorestart=false
priority=3

[program:frappe]
command=/bin/bash -c "cd /home/frappe/frappe-bench && bench build && bench serve --port 8000 --site airplane.local"
autostart=true
autorestart=true
priority=4
